[package]
name = "server"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "=0.8.8", default-features = false, features = ["http1", "json", "tokio", "ws"] }
barretenberg-rs = { version = "=5.2.0", default-features = false, features = ["native"] }
base64 = "=0.22.1"
challenge-core = { path = "../../crates/challenge-core" }
deal-core = { path = "../../crates/deal-core" }
game-core = { path = "../../crates/game-core" }
getrandom = "0.4.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
sqlx = { version = "=0.8.6", default-features = false, features = ["macros", "migrate", "postgres", "runtime-tokio", "tls-rustls-ring-webpki", "uuid"] }
tokio = { version = "1.53.1", features = ["macros", "net", "rt-multi-thread", "sync"] }
tower-http = { version = "0.6.6", features = ["cors"] }
uuid = { version = "1.24.0", features = ["serde", "v4"] }
