[package]
name = "server"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "=0.8.8", default-features = false, features = ["http1", "json", "tokio", "ws"] }
game-core = { path = "../../crates/game-core" }
getrandom = "0.4.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["macros", "net", "rt-multi-thread", "sync"] }
uuid = { version = "1.24.0", features = ["serde", "v4"] }
