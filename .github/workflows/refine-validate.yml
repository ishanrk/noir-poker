name: validate final noir poker patch replay

on:
  push:
    branches:
      - agent/noir-poker-ui-zk-redesign

permissions:
  contents: write

concurrency:
  group: noir-poker-final-refinement
  cancel-in-progress: true

jobs:
  validate:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: noir_poker_test
          POSTGRES_USER: noir_poker
          POSTGRES_PASSWORD: noir_poker
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U noir_poker -d noir_poker_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      BASE_SHA: 340a9be579c2ca26715146b4c79ff0c8f681a1b5
      WORK_BRANCH: agent/noir-poker-ui-zk-redesign
      TEST_DATABASE_URL: postgres://noir_poker:noir_poker@localhost:5432/noir_poker_test
      NEXT_PUBLIC_SERVER_URL: https://server.example

    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/noir-poker-ui-zk-redesign

      - name: Guard protected branches
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "$WORK_BRANCH"
          echo "MAIN_BEFORE=$(git ls-remote origin refs/heads/main | awk '{print $1}')" >> "$GITHUB_ENV"
          echo "DEV_BEFORE=$(git ls-remote origin refs/heads/dev | awk '{print $1}')" >> "$GITHUB_ENV"
          test "$(git rev-parse "$BASE_SHA")" = "$BASE_SHA"
          git merge-base --is-ancestor "$BASE_SHA" HEAD

      - name: Apply final CORS cleanup
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("apps/server/src/main.rs")
          text = path.read_text()
          block = '''#[cfg(test)]
          fn app(state: AppState, origin: HeaderValue) -> Router {
              app_with_origins(state, vec![origin])
          }

          '''
          if text.count(block) != 1:
              raise SystemExit(f"expected one obsolete app wrapper found {text.count(block)}")
          path.write_text(text.replace(block, "", 1))
          PY

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.93.0
          components: rustfmt, clippy

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install pinned Noir and Barretenberg
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/noir-tools"
          cd "$RUNNER_TEMP/noir-tools"
          curl -fL --retry 5 --retry-delay 2 -o nargo.tar.gz https://github.com/noir-lang/noir/releases/download/v1.0.0-beta.26/nargo-x86_64-unknown-linux-gnu.tar.gz
          echo "64048040befd55a987158b11137d8f38f9688f696db4d84910dd1bcf0442fb80  nargo.tar.gz" | sha256sum -c -
          tar -xzf nargo.tar.gz
          chmod 0755 nargo
          curl -fL --retry 5 --retry-delay 2 -o bb.tar.gz https://github.com/AztecProtocol/aztec-packages/releases/download/v5.2.0/barretenberg-amd64-linux.tar.gz
          echo "17ab8476961728cdc5c69b6c4ff427c9092cef11d1e0b0166929a0417dfa7cfb  bb.tar.gz" | sha256sum -c -
          tar -xzf bb.tar.gz
          chmod 0755 bb
          echo "NARGO_PATH=$RUNNER_TEMP/noir-tools/nargo" >> "$GITHUB_ENV"
          echo "BB_PATH=$RUNNER_TEMP/noir-tools/bb" >> "$GITHUB_ENV"

      - name: Generate current patch
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          git diff --check
          mkdir -p artifacts/refine-logs
          git diff --binary "$BASE_SHA" -- . ':(exclude).github' ':(exclude)artifacts' > artifacts/noir-poker-redesign-fairness.patch
          test -s artifacts/noir-poker-redesign-fairness.patch
          sha256sum artifacts/noir-poker-redesign-fairness.patch > artifacts/noir-poker-redesign-fairness.patch.sha256

      - name: Replay and fully validate patch
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee artifacts/refine-logs/patch-replay.log) 2>&1
          verify="$RUNNER_TEMP/noir-poker-refinement-verify"
          git worktree add --detach "$verify" "$BASE_SHA"
          git -C "$verify" apply --check "$GITHUB_WORKSPACE/artifacts/noir-poker-redesign-fairness.patch"
          git -C "$verify" apply "$GITHUB_WORKSPACE/artifacts/noir-poker-redesign-fairness.patch"
          git -C "$verify" diff --check
          cargo fmt --manifest-path "$verify/Cargo.toml" --all -- --check
          cargo test --manifest-path "$verify/Cargo.toml" --workspace --locked
          cargo clippy --manifest-path "$verify/Cargo.toml" --workspace --all-targets --locked -- -D warnings
          npm --prefix "$verify/apps/web" ci
          npm --prefix "$verify/apps/web" run challenge:test
          npm --prefix "$verify/apps/web" run deal:test
          npm --prefix "$verify/apps/web" run receipt:test
          npm --prefix "$verify/apps/web" run lint
          npm --prefix "$verify/apps/web" run build
          (
            cd "$verify"
            NARGO_PATH="$NARGO_PATH" BB_PATH="$BB_PATH" ./scripts/build-zk.sh
            TEST_DATABASE_URL="$TEST_DATABASE_URL" cargo test -p server persistence -- --ignored --nocapture
            BB_PATH="$BB_PATH" CHALLENGE_VK_PATH="$verify/apps/server/zk/challenge_v2.vk" cargo test -p server real_proof -- --ignored --nocapture
            BB_PATH="$BB_PATH" CHALLENGE_VK_PATH="$verify/apps/server/zk/challenge_v2.vk" TEST_DATABASE_URL="$TEST_DATABASE_URL" cargo test -p server real_claim -- --ignored --nocapture
            ! grep -R --include='*.tsx' --include='*.ts' '·' apps/web
            ! grep -R --include='*.tsx' -E 'not marketing|not mental|not the objective|Choose .*not|, not ' apps/web
            ! grep -R --include='*.tsx' 'type="number"' apps/web
            ! grep -R --include='*.css' -E 'linear-gradient|radial-gradient|backdrop-filter' apps/web/app/globals.css
            ! grep -F '?? "http://localhost:3001"' apps/web/lib/server.ts
            grep -F 'WEB_ORIGINS' apps/server/src/main.rs >/dev/null
            grep -F 'AllowOrigin::list' apps/server/src/main.rs >/dev/null
          )
          git -C "$verify" diff --binary "$BASE_SHA" -- . > "$RUNNER_TEMP/reapplied.patch"
          cmp "$RUNNER_TEMP/reapplied.patch" "$GITHUB_WORKSPACE/artifacts/noir-poker-redesign-fairness.patch"

      - name: Write durable report
        shell: bash
        run: |
          set -euo pipefail
          patch_sha="$(cut -d' ' -f1 artifacts/noir-poker-redesign-fairness.patch.sha256)"
          cat > artifacts/validation-report.md <<EOF
          # Noir Poker validated redesign

          Baseline: \`$BASE_SHA\`

          Patch SHA-256: \`$patch_sha\`

          ## Validation

          - Rust format, workspace tests and Clippy with warnings denied
          - challenge, deal and receipt binding tests
          - ESLint and production Next.js build
          - pinned Noir 1.0.0-beta.26 artifact rebuild
          - pinned Barretenberg 5.2.0 real proof verification
          - PostgreSQL persistence/restart and real bounty claim tests
          - full patch applied to a detached checkout at the exact baseline
          - complete suite executed against the reapplied patch
          - reapplied source diff byte-for-byte identical to the stored patch
          - no numeric spinners, gradients, glass blur, dot-separated product copy or hosted localhost fallback

          ## Deployment

          Hosted web builds require \`NEXT_PUBLIC_SERVER_URL\`. The Rust server accepts comma-separated \`WEB_ORIGINS\` and remains compatible with a single \`WEB_ORIGIN\`. SQLx migrations run automatically during server startup.

          ## Security scope

          Settled deals are independently auditable. The authoritative server still sees cards and can abort. The completed-seed selection guarantee requires at least one unpredictable non-colluding player entropy share.
          EOF
          git diff --stat "$BASE_SHA" -- . ':(exclude).github' ':(exclude)artifacts' > artifacts/diff-stat.txt
          git diff --name-status "$BASE_SHA" -- . ':(exclude).github' ':(exclude)artifacts' > artifacts/changed-files.txt

      - name: Save replay failure
        if: failure()
        shell: bash
        run: |
          set +e
          mkdir -p artifacts/refine-failure
          git status --short > artifacts/refine-failure/status.txt
          git diff --check > artifacts/refine-failure/diff-check.txt 2>&1
          git reset
          git config user.name "noir-poker-validation"
          git config user.email "actions@users.noreply.github.com"
          git add artifacts/refine-logs artifacts/refine-failure
          git commit -m "save patch replay failure [skip ci]"
          git push origin "HEAD:refs/heads/$WORK_BRANCH"

      - name: Publish validated refinement
        shell: bash
        run: |
          set -euo pipefail
          rm -rf artifacts/refine-logs artifacts/refine-failure
          rm -f .github/workflows/refine-validate.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git config user.name "noir-poker-validation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "validate ui and deployment refinement [skip ci]"
          git push origin "HEAD:refs/heads/$WORK_BRANCH"
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$MAIN_BEFORE"
          test "$(git ls-remote origin refs/heads/dev | awk '{print $1}')" = "$DEV_BEFORE"
