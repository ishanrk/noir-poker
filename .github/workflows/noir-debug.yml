name: debug isolated noir poker redesign

on:
  push:
    branches:
      - agent/noir-poker-ui-zk-redesign

permissions:
  contents: write

concurrency:
  group: noir-poker-ui-zk-redesign-debug
  cancel-in-progress: true

jobs:
  diagnose:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: noir_poker_test
          POSTGRES_USER: noir_poker
          POSTGRES_PASSWORD: noir_poker
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U noir_poker -d noir_poker_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://noir_poker:noir_poker@localhost:5432/noir_poker_test

    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/noir-poker-ui-zk-redesign

      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.93.0
          components: rustfmt

      - name: Rebuild transformed source
        shell: bash
        run: |
          set -euo pipefail
          cat tools/regen/noir-tools.part.* | base64 --decode > "$RUNNER_TEMP/noir-tools.tar.xz"
          echo "db20d0ff5ffcb9541da5e09ec84b27d4ea7c6e9064dba4bd51f562fe5a449ec7  $RUNNER_TEMP/noir-tools.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/noir-tools.tar.xz" -C tools/regen
          python -m py_compile tools/regen/common.py tools/regen/backend.py tools/regen/frontend.py tools/regen/apply.py tools/regen/persistence_fix.py
          PYTHONPATH=tools/regen python tools/regen/apply.py
          python -S tools/regen/persistence_fix.py
          cargo fmt --all

      - name: Capture persistence diagnostic
        shell: bash
        run: |
          set +e
          rm -rf artifacts/failure
          mkdir -p artifacts/failure/source
          TEST_DATABASE_URL="$TEST_DATABASE_URL" cargo test -p server persistence -- --ignored --nocapture \
            > artifacts/failure/postgres-persistence.log 2>&1
          code=$?
          printf '== postgres-persistence ==\n%s\n' "$code" > artifacts/failure/status.txt
          nl -ba apps/server/src/main.rs | sed -n '4100,4230p' > artifacts/failure/source/persistence-window.txt
          git diff --check > artifacts/failure/diff-check.log 2>&1
          git status --short > artifacts/failure/status-short.txt

      - name: Persist diagnostic on isolated branch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "agent/noir-poker-ui-zk-redesign"
          git config user.name "noir-poker-validation"
          git config user.email "actions@users.noreply.github.com"
          git add artifacts/failure
          git commit -m "save persistence diagnostic [skip ci]"
          git push origin HEAD:refs/heads/agent/noir-poker-ui-zk-redesign
