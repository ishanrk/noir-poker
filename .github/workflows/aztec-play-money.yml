name: validate aztec play money

on:
  push:
    branches:
      - agent/noir-poker-aztec-play-money
  pull_request:
    branches:
      - agent/noir-poker-ui-zk-redesign

permissions:
  contents: write

concurrency:
  group: aztec-play-money
  cancel-in-progress: true

jobs:
  validate:
    if: ${{ github.event_name == 'pull_request' || !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/noir-poker-aztec-play-money

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Validate and publish diagnostics
        shell: bash
        env:
          NEXT_PUBLIC_AZTEC_NODE_URL: https://v5.testnet.rpc.aztec-labs.com
          NEXT_PUBLIC_AZTEC_PLAY_CHIPS_ADDRESS: 0x1111111111111111111111111111111111111111111111111111111111111111
          NEXT_PUBLIC_SERVER_URL: https://example.com
          AZTEC_NODE_URL: http://127.0.0.1:8080
        run: |
          set -uo pipefail

          out="artifacts/aztec-ci"
          rm -rf "$out"
          mkdir -p "$out"
          : > "$out/status.tsv"
          failed=0

          check() {
            name="$1"
            command="$2"
            log="$out/$name.log"
            printf '$ %s\n\n' "$command" > "$log"
            bash -lc "$command" >> "$log" 2>&1
            code=$?
            printf '%s\t%s\n' "$name" "$code" >> "$out/status.tsv"
            if [ "$code" -ne 0 ]; then
              failed=1
            fi
          }

          check install-aztec 'VERSION=5.1.0 bash -i <(curl -fsSL https://install.aztec.network/5.1.0)'
          export PATH="$HOME/.aztec/bin:$PATH"
          check aztec-version 'aztec --version'
          check install-contract-deps 'cd aztec && npm install'
          check contract-policy 'cd aztec && npm run test:protocol'
          check contract-build 'cd aztec && npm run build'

          if [ -s aztec/artifacts/PlayChips.ts ]; then
            rm -rf apps/web/lib/aztec/artifacts
            mkdir -p apps/web/lib/aztec/artifacts
            cp -R aztec/artifacts/. apps/web/lib/aztec/artifacts/
          else
            printf 'generated PlayChips.ts missing\n' > "$out/copy-binding.log"
            printf 'copy-binding\t1\n' >> "$out/status.tsv"
            failed=1
          fi

          check install-web-deps 'cd apps/web && npm install'
          check challenge-test 'cd apps/web && npm run challenge:test'
          check deal-test 'cd apps/web && npm run deal:test'
          check receipt-test 'cd apps/web && npm run receipt:test'
          check aztec-id-test 'cd apps/web && npm run aztec:test'
          check web-lint 'cd apps/web && npm run lint'
          check web-build 'cd apps/web && npm run build'
          check rust-format 'cargo fmt --all -- --check'
          check rust-test 'cargo test --workspace --locked'
          check rust-clippy 'cargo clippy --workspace --all-targets --locked -- -D warnings'

          if command -v aztec >/dev/null && [ -s aztec/artifacts/PlayChips.ts ]; then
            aztec start --local-network > "$out/aztec-local.log" 2>&1 &
            node_pid=$!
            check contract-integration 'cd aztec && timeout 20m npm run test:local'
            kill "$node_pid" 2>/dev/null || true
          else
            printf 'local network skipped because contract tooling did not build\n' > "$out/contract-integration.log"
            printf 'contract-integration\t1\n' >> "$out/status.tsv"
            failed=1
          fi

          check diff-check 'git diff --check'

          {
            printf '# Aztec mode validation\n\n'
            if [ "$failed" -eq 0 ]; then
              printf '**PASS**\n\n'
            else
              printf '**FAIL**\n\n'
            fi
            printf '| check | exit |\n|---|---:|\n'
            while IFS=$'\t' read -r name code; do
              printf '| `%s` | %s |\n' "$name" "$code"
            done < "$out/status.tsv"
          } > "$out/README.md"

          git config user.name "noir-poker-aztec-validation"
          git config user.email "actions@users.noreply.github.com"
          git add artifacts/aztec-ci
          if [ -s aztec/package-lock.json ]; then
            git add aztec/package-lock.json
          fi
          if [ -s apps/web/package-lock.json ]; then
            git add apps/web/package-lock.json
          fi
          if [ -s apps/web/lib/aztec/artifacts/PlayChips.ts ]; then
            git add apps/web/lib/aztec/artifacts
          fi
          if ! git diff --cached --quiet; then
            git commit -m "record aztec validation [skip ci]"
            git push origin HEAD:agent/noir-poker-aztec-play-money
          fi

          exit "$failed"

      - name: Upload validation files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aztec-play-money-validation
          path: |
            artifacts/aztec-ci
            aztec/artifacts
            aztec/target
            aztec/package-lock.json
            apps/web/lib/aztec/artifacts
            apps/web/package-lock.json
          if-no-files-found: warn
          retention-days: 14
