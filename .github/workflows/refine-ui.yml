name: validate noir poker ui refinement

on:
  push:
    branches:
      - agent/noir-poker-ui-zk-redesign

permissions:
  contents: write

concurrency:
  group: noir-poker-ui-refinement
  cancel-in-progress: true

jobs:
  validate:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: noir_poker_test
          POSTGRES_USER: noir_poker
          POSTGRES_PASSWORD: noir_poker
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U noir_poker -d noir_poker_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      BASE_SHA: 340a9be579c2ca26715146b4c79ff0c8f681a1b5
      WORK_BRANCH: agent/noir-poker-ui-zk-redesign
      TEST_DATABASE_URL: postgres://noir_poker:noir_poker@localhost:5432/noir_poker_test
      NEXT_PUBLIC_SERVER_URL: https://server.example

    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/noir-poker-ui-zk-redesign

      - name: Guard protected branches
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "$WORK_BRANCH"
          echo "MAIN_BEFORE=$(git ls-remote origin refs/heads/main | awk '{print $1}')" >> "$GITHUB_ENV"
          echo "DEV_BEFORE=$(git ls-remote origin refs/heads/dev | awk '{print $1}')" >> "$GITHUB_ENV"

      - name: Apply focused style and deployment refinements
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          css_path = Path("apps/web/app/globals.css")
          css = css_path.read_text()

          def one(old: str, new: str, label: str) -> None:
              global css
              count = css.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match found {count}")
              css = css.replace(old, new, 1)

          one("  grid-template-columns: 1fr auto 1fr;", "  grid-template-columns: 1fr auto;", "header grid")
          one("  margin: 12px 0 24px;\n  font-family: Georgia, \"Times New Roman\", serif;\n  font-size: clamp(48px, 6.4vw, 80px);", "  margin: 0 0 24px;\n  font-family: Georgia, \"Times New Roman\", serif;\n  font-size: clamp(48px, 6.4vw, 80px);", "hero title spacing")
          one(
              ".lobby-wrap {\n  display: grid;\n  grid-template-columns: 180px minmax(0, 1fr);\n  gap: 30px;\n  width: min(100% - 40px, 1040px);\n  margin: 0 auto;\n  padding: 90px 0 100px;\n}",
              ".lobby-wrap {\n  width: min(100% - 40px, 1040px);\n  margin: 0 auto;\n  padding: 90px 0 100px;\n}",
              "lobby layout",
          )
          one(".form-heading h3 { margin: 7px 0 0;", ".form-heading h3 { margin: 0;", "form heading")
          one(
              ".sealed-bounty-face { position: relative; z-index: 2; display: grid; height: 268px; align-content: space-between; padding: 22px; border: 2px solid var(--ink); color: white; background: var(--blue); box-shadow: 10px 10px 0 var(--lime); overflow: hidden; }",
              ".sealed-bounty-face { position: relative; z-index: 2; display: grid; height: 268px; align-content: space-between; padding: 22px; border: 1px solid var(--ink); color: white; background: var(--blue); box-shadow: inset 0 0 0 1px rgb(255 255 255 / 28%), 7px 7px 0 var(--lime); overflow: hidden; }",
              "bounty face border",
          )
          one(
              ".sealed-bounty > i { position: absolute; z-index: 1; right: -12px; bottom: 2px; width: 100%; height: 268px; border: 1px solid var(--line-strong); }",
              ".sealed-bounty > i { position: absolute; z-index: 1; right: -7px; bottom: 7px; width: 100%; height: 268px; border: 1px solid var(--line-strong); }",
              "bounty back border",
          )
          one(
              ".receipt-statement, .audit-transcript, .protocol-section { display: grid; grid-template-columns: 180px minmax(0, 1fr); gap: 30px; width: min(100% - 40px, 1040px); margin: 0 auto; padding: 82px 0; border-bottom: 1px solid var(--line-strong); }",
              ".receipt-statement, .audit-transcript { display: grid; grid-template-columns: 180px minmax(0, 1fr); gap: 30px; width: min(100% - 40px, 1040px); margin: 0 auto; padding: 82px 0; border-bottom: 1px solid var(--line-strong); }\n.protocol-section { width: min(100% - 40px, 1040px); margin: 0 auto; padding: 72px 0; border-bottom: 1px solid var(--line-strong); }",
              "protocol layout",
          )
          one(".protocol-section { align-items: start; }", ".protocol-section { display: block; }", "protocol block")
          one(
              "  .lobby-wrap, .receipt-statement, .audit-transcript, .protocol-section { grid-template-columns: 130px minmax(0, 1fr); }",
              "  .receipt-statement, .audit-transcript { grid-template-columns: 130px minmax(0, 1fr); }",
              "tablet protocol grid",
          )
          one(
              "  .lobby-wrap, .receipt-statement, .audit-transcript, .protocol-section { display: block; width: min(100% - 32px, 1040px); padding: 58px 0; }",
              "  .lobby-wrap, .protocol-section { width: min(100% - 32px, 1040px); padding: 58px 0; }\n  .receipt-statement, .audit-transcript { display: block; width: min(100% - 32px, 1040px); padding: 58px 0; }",
              "mobile section layout",
          )
          one(
              "  .lobby-wrap > .section-index, .receipt-statement > .section-index, .audit-transcript > .section-index, .protocol-section > .section-index { margin-bottom: 24px; }",
              "  .receipt-statement > .section-index, .audit-transcript > .section-index { margin-bottom: 24px; }",
              "mobile section index",
          )

          extra = '''\n.site-footer {
            display: flex;
            justify-content: space-between;
            align-items: end;
            gap: 28px;
            width: min(100% - 40px, 1120px);
            margin: 0 auto;
            padding: 30px 0 42px;
            border-top: 1px solid var(--line-strong);
          }
          .site-footer > div { display: grid; gap: 6px; }
          .site-footer span, .protocol-stack dt {
            color: var(--blue);
            font-family: "Courier New", monospace;
            font-size: 9px;
            font-weight: 700;
            text-transform: uppercase;
          }
          .site-footer > div > a { font-family: Georgia, "Times New Roman", serif; font-size: 20px; text-decoration: none; }
          .site-footer nav { display: flex; gap: 22px; }
          .site-footer nav a { color: var(--blue); font-size: 12px; font-weight: 700; text-underline-offset: 3px; }
          .protocol-stack { margin: 30px 0 0; border-top: 1px solid var(--line-strong); }
          .protocol-stack > div { display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 20px; padding: 11px 0; border-bottom: 1px solid var(--line); }
          .protocol-stack dt { margin: 0; }
          .protocol-stack dd { overflow-wrap: anywhere; margin: 0; font-family: "Courier New", monospace; font-size: 10px; }
          .protocol-list { display: grid; gap: 10px; max-width: 790px; margin: 26px 0 0; padding-left: 20px; color: #505760; font-size: 15px; line-height: 1.6; }
          .verifier-commands h3 { margin: 32px 0 8px; font-family: Georgia, "Times New Roman", serif; font-size: 22px; font-weight: 500; }
          '''
          marker = "\n@keyframes hero-card-one"
          if css.count(marker) != 1:
              raise SystemExit("keyframe marker missing")
          css = css.replace(marker, extra + marker, 1)
          mobile = "  .site-footer { display: block; width: calc(100% - 32px); }\n  .site-footer nav { margin-top: 18px; }\n  .protocol-stack > div { grid-template-columns: 1fr; gap: 5px; }\n"
          marker = "  .site-header { height: auto; min-height: 62px; gap: 12px; padding: 12px 16px; }\n"
          if css.count(marker) != 1:
              raise SystemExit("mobile marker missing")
          css = css.replace(marker, marker + mobile, 1)
          css_path.write_text(css)

          main_path = Path("apps/server/src/main.rs")
          main = main_path.read_text()

          def main_one(old: str, new: str, label: str) -> None:
              global main
              count = main.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match found {count}")
              main = main.replace(old, new, 1)

          main_one("use tower_http::cors::CorsLayer;", "use tower_http::cors::{AllowOrigin, CorsLayer};", "cors import")
          main_one(
              "    let origin: HeaderValue = env::var(\"WEB_ORIGIN\")\n        .unwrap_or_else(|_| \"http://localhost:3000\".to_owned())\n        .parse()?;",
              "    let origins = web_origins()?;",
              "web origin env",
          )
          main_one(
              "    axum::serve(listener, app(AppState::new(db, rooms, proof), origin)).await?;",
              "    axum::serve(\n        listener,\n        app_with_origins(AppState::new(db, rooms, proof), origins),\n    )\n    .await?;",
              "serve app",
          )
          main_one(
              "fn app(state: AppState, origin: HeaderValue) -> Router {",
              "#[cfg(test)]\nfn app(state: AppState, origin: HeaderValue) -> Router {\n    app_with_origins(state, vec![origin])\n}\n\nfn app_with_origins(state: AppState, origins: Vec<HeaderValue>) -> Router {",
              "app function",
          )
          main_one("                .allow_origin(origin)", "                .allow_origin(AllowOrigin::list(origins))", "cors origin")
          helper = '''\nfn web_origins() -> Result<Vec<HeaderValue>, Box<dyn std::error::Error + Send + Sync>> {
    let raw = env::var("WEB_ORIGINS")
        .or_else(|_| env::var("WEB_ORIGIN"))
        .unwrap_or_else(|_| "http://localhost:3000".to_owned());
    let origins = raw
        .split(',')
        .map(str::trim)
        .filter(|origin| !origin.is_empty())
        .map(str::parse)
        .collect::<Result<Vec<HeaderValue>, _>>()?;

    if origins.is_empty() {
        return Err(io::Error::other("WEB_ORIGINS empty").into());
    }

    Ok(origins)
}
\n'''
          marker = "async fn health() -> &'static str {"
          if main.count(marker) != 1:
              raise SystemExit("health marker missing")
          main = main.replace(marker, helper + marker, 1)
          main_path.write_text(main)
          PY

      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.93.0
          components: rustfmt, clippy

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install Noir and Barretenberg
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/noir-tools"
          cd "$RUNNER_TEMP/noir-tools"
          curl -fL --retry 5 --retry-delay 2 -o nargo.tar.gz https://github.com/noir-lang/noir/releases/download/v1.0.0-beta.26/nargo-x86_64-unknown-linux-gnu.tar.gz
          echo "64048040befd55a987158b11137d8f38f9688f696db4d84910dd1bcf0442fb80  nargo.tar.gz" | sha256sum -c -
          tar -xzf nargo.tar.gz
          chmod 0755 nargo
          curl -fL --retry 5 --retry-delay 2 -o bb.tar.gz https://github.com/AztecProtocol/aztec-packages/releases/download/v5.2.0/barretenberg-amd64-linux.tar.gz
          echo "17ab8476961728cdc5c69b6c4ff427c9092cef11d1e0b0166929a0417dfa7cfb  bb.tar.gz" | sha256sum -c -
          tar -xzf bb.tar.gz
          chmod 0755 bb
          echo "NARGO_PATH=$RUNNER_TEMP/noir-tools/nargo" >> "$GITHUB_ENV"
          echo "BB_PATH=$RUNNER_TEMP/noir-tools/bb" >> "$GITHUB_ENV"
          echo "CHALLENGE_VK_PATH=$GITHUB_WORKSPACE/apps/server/zk/challenge_v2.vk" >> "$GITHUB_ENV"

      - name: Validate source and persistence
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          git diff --check
          cargo test --workspace --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings
          npm --prefix apps/web ci
          npm --prefix apps/web run challenge:test
          npm --prefix apps/web run deal:test
          npm --prefix apps/web run receipt:test
          npm --prefix apps/web run lint
          npm --prefix apps/web run build
          NARGO_PATH="$NARGO_PATH" BB_PATH="$BB_PATH" ./scripts/build-zk.sh
          TEST_DATABASE_URL="$TEST_DATABASE_URL" cargo test -p server persistence -- --ignored --nocapture
          BB_PATH="$BB_PATH" CHALLENGE_VK_PATH="$CHALLENGE_VK_PATH" cargo test -p server real_proof -- --ignored --nocapture
          BB_PATH="$BB_PATH" CHALLENGE_VK_PATH="$CHALLENGE_VK_PATH" TEST_DATABASE_URL="$TEST_DATABASE_URL" cargo test -p server real_claim -- --ignored --nocapture
          ! grep -R --include='*.tsx' --include='*.ts' '·' apps/web
          ! grep -R --include='*.tsx' -E 'not marketing|not mental|not the objective|Choose .*not|, not ' apps/web
          ! grep -R --include='*.tsx' 'type="number"' apps/web
          ! grep -R --include='*.css' -E 'linear-gradient|radial-gradient|backdrop-filter' apps/web/app/globals.css
          ! grep -F '?? "http://localhost:3001"' apps/web/lib/server.ts

      - name: Regenerate durable patch
        shell: bash
        run: |
          set -euo pipefail
          rm -rf artifacts/failure artifacts/failure-final artifacts/logs
          mkdir -p artifacts
          git add -A
          git diff --cached --binary "$BASE_SHA" -- . ':(exclude).github/workflows/refine-ui.yml' ':(exclude)artifacts' > artifacts/noir-poker-redesign-fairness.patch
          test -s artifacts/noir-poker-redesign-fairness.patch
          sha256sum artifacts/noir-poker-redesign-fairness.patch > artifacts/noir-poker-redesign-fairness.patch.sha256
          verify="$RUNNER_TEMP/noir-poker-refine-verify"
          git worktree add --detach "$verify" "$BASE_SHA"
          git -C "$verify" apply --check "$GITHUB_WORKSPACE/artifacts/noir-poker-redesign-fairness.patch"
          git -C "$verify" apply "$GITHUB_WORKSPACE/artifacts/noir-poker-redesign-fairness.patch"
          git -C "$verify" diff --check
          cat > artifacts/validation-report.md <<EOF
          # Noir Poker validated redesign

          Baseline: \`$BASE_SHA\`

          Validation passed for Rust formatting, workspace tests, Clippy with warnings denied, frontend challenge/deal/receipt tests, ESLint, production Next.js build, pinned Noir artifact rebuild, Barretenberg proof verification, PostgreSQL persistence and real bounty claim tests.

          Deployment behavior requires \`NEXT_PUBLIC_SERVER_URL\` on hosted frontends. The Rust server accepts an explicit comma-separated \`WEB_ORIGINS\` list and remains backward compatible with \`WEB_ORIGIN\`.

          The deal audit remains server-authoritative: the server sees cards and can abort. A completed-hand seed is protected against unilateral server selection when at least one player contribution is unpredictable and non-colluding.
          EOF
          git diff --stat "$BASE_SHA" -- . ':(exclude).github' ':(exclude)artifacts' > artifacts/diff-stat.txt
          git diff --name-status "$BASE_SHA" -- . ':(exclude).github' ':(exclude)artifacts' > artifacts/changed-files.txt

      - name: Publish validated refinement
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/refine-ui.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git config user.name "noir-poker-validation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "refine ui and deployment config [skip ci]"
          git push origin "HEAD:refs/heads/$WORK_BRANCH"
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$MAIN_BEFORE"
          test "$(git ls-remote origin refs/heads/dev | awk '{print $1}')" = "$DEV_BEFORE"
