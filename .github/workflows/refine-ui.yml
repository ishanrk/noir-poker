name: apply noir poker ui refinement

on:
  push:
    branches:
      - agent/noir-poker-ui-zk-redesign

permissions:
  contents: write

concurrency:
  group: noir-poker-ui-refinement
  cancel-in-progress: true

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      WORK_BRANCH: agent/noir-poker-ui-zk-redesign
      NEXT_PUBLIC_SERVER_URL: https://server.example

    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/noir-poker-ui-zk-redesign

      - name: Guard protected branches
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "$WORK_BRANCH"
          echo "MAIN_BEFORE=$(git ls-remote origin refs/heads/main | awk '{print $1}')" >> "$GITHUB_ENV"
          echo "DEV_BEFORE=$(git ls-remote origin refs/heads/dev | awk '{print $1}')" >> "$GITHUB_ENV"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.93.0
          components: rustfmt

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Apply refinement
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/refine-failure
          python tools/refine_ui.py |& tee artifacts/refine-failure/transform.log
          cargo fmt --all
          git diff --check

      - name: Sanity check source
        shell: bash
        run: |
          set -euo pipefail
          cargo check --workspace |& tee artifacts/refine-failure/cargo-check.log
          npm --prefix apps/web ci |& tee artifacts/refine-failure/npm-ci.log
          npm --prefix apps/web run lint |& tee artifacts/refine-failure/eslint.log
          npm --prefix apps/web run build |& tee artifacts/refine-failure/next-build.log
          ! grep -R --include='*.tsx' --include='*.ts' '·' apps/web
          ! grep -R --include='*.tsx' -E 'not marketing|not mental|not the objective|Choose .*not|, not ' apps/web
          ! grep -R --include='*.tsx' 'type="number"' apps/web
          ! grep -R --include='*.css' -E 'linear-gradient|radial-gradient|backdrop-filter' apps/web/app/globals.css
          ! grep -F '?? "http://localhost:3001"' apps/web/lib/server.ts

      - name: Save failure diagnostics
        if: failure()
        shell: bash
        run: |
          set +e
          git status --short > artifacts/refine-failure/status.txt
          git diff --check > artifacts/refine-failure/diff-check.txt 2>&1
          git reset
          git config user.name "noir-poker-validation"
          git config user.email "actions@users.noreply.github.com"
          git add artifacts/refine-failure
          git commit -m "save ui refinement failure [skip ci]"
          git push origin "HEAD:refs/heads/$WORK_BRANCH"

      - name: Publish refined source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf artifacts/refine-failure
          rm -f tools/refine_ui.py .github/workflows/refine-ui.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git config user.name "noir-poker-validation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "apply ui and deployment refinement [skip ci]"
          git push origin "HEAD:refs/heads/$WORK_BRANCH"
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$MAIN_BEFORE"
          test "$(git ls-remote origin refs/heads/dev | awk '{print $1}')" = "$DEV_BEFORE"
